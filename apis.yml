aid: cardboard
name: Cardboard
description: >-
  Cardboard is an agentic AI video editor that runs entirely in the browser.
  Users import raw footage and describe the edit in natural language — "make a
  60-second recap", "cut this into ads" — and Cardboard cuts, captions, reframes
  (vertical/square/landscape), removes silences, generates and clones voiceovers,
  translates and dubs across languages, and composes a first draft on a real
  timeline the user can refine. It is built on multimodal LLMs plus WebGPU/WebCodecs
  to make a genuine non-linear editor possible in the browser, with real-time
  collaboration and frame-pinned comments. Cardboard was founded in the Y Combinator
  Winter 2026 batch and is a consumer/prosumer creative application; it does not
  currently publish a public developer API.
